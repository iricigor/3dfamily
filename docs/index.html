    .scene {
      position: relative;
      min-width: 100%;
      margin: 0 auto;
      isolation: isolate;
    }

    .ground {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ground polygon {
      fill: var(--ground);
      stroke: var(--ground-border);
      stroke-width: 1;
    }

    .connector {

      stroke-linecap: round;
    }

    .connector.spouse {

      stroke-width: 3;
      stroke-dasharray: 8 6;
    }

    .group {

    .group h2 {
      display: none;

    .person {
      position: absolute;
      display: grid;
      width: 174px;
      min-height: 104px;
      align-content: center;
      justify-items: center;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 0.7rem;
      background: var(--panel-bg);
      box-shadow:
        3px 4px 0 var(--tile-shadow),
        0 9px 10px -8px var(--tile-shadow-soft);
      color: var(--text);
      font: inherit;
      text-align: center;
      cursor: pointer;
      transform: translate(-50%, -100%) scale(var(--scale));
      transform-origin: center bottom;

    .person::before {
      position: absolute;
      z-index: 0;
      top: 100%;
      right: 0;
      left: 0;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: inherit;
      background: inherit;
      content: "";
      opacity: 0.22;
      transform: scaleY(-1);
      mask-image: linear-gradient(to bottom, #000, transparent 75%);
    }

    .person::after {
      position: absolute;
      z-index: -1;
      right: -5%;
      bottom: -11px;
      left: -5%;
      height: 12px;
      border-radius: 50%;
      background: rgba(37, 58, 55, 0.2);
      filter: blur(4px);
      content: "";
    }

    .person:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    .person strong {
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .person small {
      margin-top: 6px;
      color: var(--person-muted);

        0 9px 10px -8px var(--tile-shadow-soft),
        inset 0 0 0 2px var(--center-inset);
    }

    .person.parent {
      background: var(--parent-bg);
    }

    .person.child {
      background: var(--child-bg);
    }

    .person.child::after {
      right: -12%;
      left: -12%;
      height: 16px;
      filter: blur(5px);
    }

    .person.spouse {
      background: var(--spouse-bg);
    }

    .person.sibling {
      background: var(--sibling-bg);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      main {
        width: min(100% - 20px, 1200px);
        padding-top: 16px;
      }

      .stage {
        overflow: visible;
      }

      .scene {
        display: grid;
        gap: 14px;
        width: 100% !important;
        height: auto !important;
      }

      .ground {
        display: none;
      }

      .group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));
        gap: 8px;
      }

      .group h2 {
        display: block;
        grid-column: 1 / -1;
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .person, .person.center {
        position: relative;
        top: auto !important;
        left: auto !important;
        width: 100%;
        min-height: 88px;
        transform: none;
      }

      .person::before, .person::after {
        display: none;
      }
    }

<body>
  <main>
    <header>
      <img class="tree-icon" src="tree-icon.svg" width="48" height="48" alt="">
      <h1>3D Family</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>
    <p class="intro">Upload a GEDCOM family tree to see the first person in the file and their close family.</p>
    <section class="upload" aria-label="Upload family tree">
      <label for="gedcom-file">Choose a GEDCOM file (.ged) or drop it here</label>
      <input id="gedcom-file" type="file" accept=".ged,.gedcom,text/plain">
    </section>
    <p id="status" class="status" role="status" aria-live="polite">Your file is read in this page and is not uploaded to a server.</p>
    <div id="family-view" hidden>
      <div class="key" aria-label="Family member positions">
        <span style="--swatch:#d9d3ff">Parents behind</span>
        <span style="--swatch:#b7d4ff">Center</span>
        <span style="--swatch:#bcebd7">Children in front</span>
        <span style="--swatch:#ffdfb8">Spouses left</span>
        <span style="--swatch:#ffd2d8">Siblings right</span>
      </div>
      <div class="stage" tabindex="0" role="region" aria-label="Family view; scroll horizontally for more people">
        <div id="scene" class="scene"></div>
      </div>
    </div>
  </main>
  <script>
    "use strict";

    const fileInput = document.querySelector("#gedcom-file");
    const uploadArea = document.querySelector(".upload");
    const status = document.querySelector("#status");
    const familyView = document.querySelector("#family-view");
    const scene = document.querySelector("#scene");
    const themeToggle = document.querySelector("#theme-toggle");
    let familyData = null;

    themeToggle.addEventListener("click", () => {
      const isDark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      themeToggle.setAttribute("aria-pressed", String(isDark));
    });

    function parseGedcom(text) {
      const individuals = new Map();
      const families = new Map();
      let current = null;

      for (const rawLine of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
        const line = rawLine.trim();
        if (/^0(?:\s|$)/.test(line)) {
          current = null;
          const record = line.match(/^0\s+(@[^@]+@)\s+(INDI|FAM)\b/);
          if (!record) continue;
          current = record[2] === "INDI"
            ? { type: "INDI", id: record[1], name: "", sex: "", famc: [], fams: [] }
            : { type: "FAM", id: record[1], husband: "", wife: "", children: [] };
          (current.type === "INDI" ? individuals : families).set(current.id, current);
          continue;
        }

        if (!current) continue;

        const field = line.match(/^1\s+(\w+)(?:\s+(.*))?$/);
        if (!field) continue;
        const [, tag, value = ""] = field;

        if (current.type === "INDI") {
          if (tag === "NAME") current.name = value.replaceAll("/", "").replace(/\s+/g, " ").trim();
          if (tag === "SEX") current.sex = value.trim();
          if (tag === "FAMC") current.famc.push(value.trim());
          if (tag === "FAMS") current.fams.push(value.trim());
        } else {
          if (tag === "HUSB") current.husband = value.trim();
          if (tag === "WIFE") current.wife = value.trim();
          if (tag === "CHIL") current.children.push(value.trim());
        }
      }

      return { individuals, families };
    }

    function relativesOf(center, individuals, families) {
      const parents = new Set();
      const siblings = new Set();
      const spouses = new Set();
      const children = new Set();

      for (const familyId of center.famc) {
        const family = families.get(familyId);
        if (!family) continue;
        if (family.husband) parents.add(family.husband);
        if (family.wife) parents.add(family.wife);
        for (const childId of family.children) {
          if (childId !== center.id) siblings.add(childId);
        }
      }

      for (const familyId of center.fams) {
        const family = families.get(familyId);
        if (!family) continue;
        for (const partnerId of [family.husband, family.wife]) {
          if (partnerId && partnerId !== center.id) spouses.add(partnerId);
        }
        for (const childId of family.children) {
          if (childId !== center.id) children.add(childId);
        }
      }

      const people = (ids) => [...ids]
        .map((id) => individuals.get(id))
        .filter(Boolean);

      return {
        parents: people(parents),
        siblings: people(siblings),
        spouses: people(spouses),
        children: people(children)
      };
    }

    function addPerson(person, role, group) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = `person ${role}`;
      card.dataset.personId = person.id;

      const name = document.createElement("strong");
      name.textContent = person.name || `Unknown person (${person.id})`;
      const label = document.createElement("small");
      label.textContent = role === "center" ? "Center person" : role;
      card.append(name, label);
      group.append(card);
    }

    function addGroup(people, role, title) {
      if (!people.length) return;
      const group = document.createElement("section");
      group.className = "group";
      group.setAttribute("aria-label", title);
      const heading = document.createElement("h2");
      heading.textContent = title;
      group.append(heading);
      people.forEach((person) => addPerson(person, role, group));
      scene.append(group);
    }

    function layoutScene() {
      if (familyView.hidden || window.matchMedia("(max-width: 700px)").matches) return;

      const cards = (role) => [...scene.querySelectorAll(`.person.${role}`)];
      const parents = cards("parent");
      const spouses = cards("spouse");
      const center = cards("center")[0];
      const siblings = cards("sibling");
      const children = cards("child");
      if (!center) return;

      const width = Math.max(
        scene.parentElement.clientWidth, 600,
        parents.length * 190 + 40,
        children.length * 205 + 40,
        2 * (220 + Math.max(spouses.length - 1, siblings.length - 1, 0) * 190 + 110)
      );
      scene.style.width = `${width}px`;

      const heightOf = (items, scale) => Math.max(0, ...items.map((card) => card.offsetHeight * scale));
      const parentY = 20 + heightOf(parents, 0.9);
      const middleY = parentY + (parents.length ? 40 : 0) + heightOf([center, ...spouses, ...siblings], 1);
      const childY = middleY + (children.length ? 40 + heightOf(children, 1.05) : 0);
      const height = childY + 64;
      scene.style.height = `${height}px`;

      const ground = scene.querySelector(".ground");
      ground.setAttribute("viewBox", `0 0 ${width} ${height}`);
      ground.replaceChildren();
      const polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      const groundTop = (parents.length ? parentY : middleY) - 8;
      polygon.setAttribute("points", `20,${groundTop} ${width - 20},${groundTop} ${width},${height} 0,${height}`);
      ground.append(polygon);

      const positions = [];
      const place = (card, x, y, scale, role) => {
        card.style.left = `${x}px`;
        card.style.top = `${y}px`;
        card.style.setProperty("--scale", scale);
        positions.push({ x, y, role });
      };
      const middleX = width / 2;
      parents.forEach((card, index) => place(card, middleX + (index - (parents.length - 1) / 2) * 190, parentY, 0.9, "parent"));
      place(center, middleX, middleY, 1, "center");
      spouses.forEach((card, index) => place(card, middleX - 220 - index * 190, middleY, 1, "spouse"));
      siblings.forEach((card, index) => place(card, middleX + 220 + index * 190, middleY, 1, "sibling"));
      children.forEach((card, index) => place(card, middleX + (index - (children.length - 1) / 2) * 205, childY, 1.05, "child"));

      positions.filter((position) => position.role !== "center").forEach((position) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", `connector ${position.role}`);
        line.setAttribute("x1", middleX);
        line.setAttribute("y1", middleY);
        line.setAttribute("x2", position.x);
        line.setAttribute("y2", position.y);
        ground.append(line);
      });
    }

    function renderFamily({ individuals, families }, centerId) {
      const center = centerId === undefined
        ? individuals.values().next().value
        : individuals.get(centerId);
      if (!center) throw new Error("No people were found. Choose a GEDCOM file containing INDI records.");

      const relatives = relativesOf(center, individuals, families);
      scene.replaceChildren();
      const ground = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      ground.classList.add("ground");
      ground.setAttribute("aria-hidden", "true");
      scene.append(ground);
      addGroup(relatives.parents, "parent", "Parents");
      addGroup(relatives.spouses, "spouse", "Spouses");
      addGroup([center], "center", "Center person");
      addGroup(relatives.siblings, "sibling", "Siblings");
      addGroup(relatives.children, "child", "Children");

      const count = relatives.parents.length + relatives.children.length +
        relatives.spouses.length + relatives.siblings.length;
      status.dataset.error = "false";
      status.textContent = `${center.name || `Unknown person (${center.id})`} is centered. ${count} close family member${count === 1 ? "" : "s"} shown.`;
      familyView.hidden = false;
      layoutScene();
      const stage = scene.parentElement;
      stage.scrollLeft = (stage.scrollWidth - stage.clientWidth) / 2;
    }

    scene.addEventListener("click", (event) => {
      const card = event.target.closest(".person");
      if (!familyData || !card || !scene.contains(card)) return;
      renderFamily(familyData, card.dataset.personId);
      scene.querySelector(".person.center").focus();
    });

    window.addEventListener("resize", layoutScene);

    uploadArea.addEventListener("dragover", (event) => {
      event.preventDefault();
      uploadArea.classList.add("is-dragging");
    });

    uploadArea.addEventListener("dragleave", () => {
      uploadArea.classList.remove("is-dragging");
    });

    uploadArea.addEventListener("drop", (event) => {
      event.preventDefault();
      uploadArea.classList.remove("is-dragging");
      if (event.dataTransfer.files.length) {
        fileInput.files = event.dataTransfer.files;
        fileInput.dispatchEvent(new Event("change"));
      }
    });

    fileInput.addEventListener("change", async () => {
      familyView.hidden = true;
      scene.replaceChildren();
      familyData = null;
      delete status.dataset.error;
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;

      try {
        const data = parseGedcom(await file.text());
        renderFamily(data);
        familyData = data;
      } catch (error) {
        status.dataset.error = "true";
        status.textContent = error instanceof Error ? error.message : "The GEDCOM file could not be read.";
      }
    });
  </script>
</body>
</html>
